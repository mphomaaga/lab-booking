[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-booking-backend"
version = "0.1.0"
description = "Campus lab booking API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

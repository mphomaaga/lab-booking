# Run everything: `cp .env.example .env`, set JWT_SECRET, then `docker compose up --build`.
# Frontend: http://localhost:5173   Backend: http://localhost:8000 (docs at /docs)
services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      # Overrides DATABASE_URL from .env: the SQLite file lives on the db-data volume.
      DATABASE_URL: sqlite:////data/lab_booking.db
      # To load the real accounts, mount the Campus Operations CSV (never committed,
      # never copied into the image) and point ACCOUNTS_CSV_PATH at it. Uncomment this
      # line and the matching volume below:
      # ACCOUNTS_CSV_PATH: /run/accounts.csv
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
      # - ./backend/seed_data/accounts.csv:/run/accounts.csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_API_BASE_URL is the address the browser uses to reach the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        # Always the real API in Docker, whatever .env.example says for local dev.
        VITE_USE_MOCK_API: "false"
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
